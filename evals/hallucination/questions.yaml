# Questions for the invented-function A/B. Issue #10.
#
# Each one has to be a question whose answer NAMES DAX FUNCTIONS, because that is what the
# metric counts. A question answerable in prose measures nothing.
#
# `regime` splits the bank in two on purpose, and it is the design requirement the issue
# insists on. The 31 field notes and the 99 example files are all classic-model DAX;
# for INFO.* and visual calculations this library ships Microsoft's card and no judgement
# of its own. Averaged together, the headline number would be a blend of two different
# claims and would not say which half it is describing.
#
# `category` is the catalogue category whose rows arm B is given. Not the answer's card:
# handing over the card that holds the answer would measure nothing but obedience. The
# rows are the first hop SKILL.md actually documents — "read catalog.md, find the
# function" — so arm B knows WHAT EXISTS, and still has to choose.
#
# `traps` are function names this question is known to attract that do not exist. They are
# not the metric — the metric is the whole catalogue — they are here so a reader can see
# what the question is for, and they are asserted to be absent from the catalogue by a
# test, so a trap that Microsoft later ships stops being a trap loudly.

questions:
  - id: previous-year
    regime: classic
    category: time-intelligence
    question: >-
      In DAX, which function gives me the same measure for the equivalent period of the
      previous year, so I can put this year and last year side by side? Name the function
      and show a short measure.
    traps: [PREVIOUSYEARTOTAL, SAMEPERIODPREVIOUSYEAR, LASTYEARTOTAL]

  - id: running-total-ytd
    regime: classic
    category: time-intelligence
    question: >-
      I need a year-to-date running total of Sales in DAX. Which function should I reach
      for, and is there more than one way? Show the measure.
    traps: [YTDTOTAL, RUNNINGTOTALYTD, TOTALYEARTODATE]

  - id: previous-row
    regime: classic
    category: filter
    question: >-
      In a DAX table sorted by date, how do I compare each row with the previous one
      without writing a self-join? Name the functions involved.
    traps: [PREVIOUSROW, LAG, PRIORROW]

  - id: moving-window
    regime: window
    category: filter
    question: >-
      Which DAX function gives me a moving window of the last N rows relative to the
      current one, and what does it need to know about ordering? Show the syntax.
    traps: [MOVINGWINDOW, ROLLINGWINDOW, SLIDINGWINDOW]

  - id: rank-in-partition
    regime: window
    category: filter
    question: >-
      How do I rank rows inside a partition in DAX using the newer window-function
      syntax, rather than RANKX? Name the function and show it.
    traps: [RANKWINDOW, DENSERANK, ROWRANK]

  - id: running-sum-window
    regime: window
    category: filter
    question: >-
      Is there a DAX function that computes a running sum directly, without CALCULATE and
      a filter over dates? Name it if it exists.
    traps: [CUMULATIVESUM, ACCUMULATE, RUNNINGTOTAL]

  - id: list-model-tables
    regime: info
    category: info
    question: >-
      From a DAX query, how do I list the tables in the model with their names and
      descriptions? Name the function.
    # INFO.TABLES y INFO.VIEW.TABLES existen las dos; solo estas son inventadas.
    traps: [MODELTABLES, DMV.TABLES, INFO.LISTTABLES]

  - id: list-model-measures
    regime: info
    category: info
    question: >-
      Which DAX function lets me read every measure in the model, with its expression,
      from a query? Name it and show the query.
    traps: [MODELMEASURES, INFO.LISTMEASURES]

  - id: list-relationships
    regime: info
    category: info
    question: >-
      I want to audit my model's relationships from a DAX query — which ones are active,
      what they join. Which function do I use?
    traps: [MODELRELATIONSHIPS, INFO.LISTRELATIONSHIPS]

  - id: visual-axis-collapse
    regime: visual
    # "" is not a placeholder: COLLAPSE, EXPAND and ISATLEVEL are three of the sixteen
    # functions the catalogue leaves UNCATEGORISED (see the 2026-08-17 decision record).
    # So the honest arm B for this regime is that bucket, which is also the finding: for
    # visual calculations the catalogue cannot even offer a category to look in.
    category: ""
    question: >-
      In a Power BI visual calculation, which functions move up and down the visual's
      axis — collapsing to a parent level or expanding to a lower one? Name them.
    # ROLLUP existe (agrupacion), asi que nombrarla no es inventar aunque no sirva aqui.
    traps: [DRILLUP, DRILLDOWN, PARENTLEVEL]

  - id: visual-first-last
    regime: visual
    category: filter
    question: >-
      Inside a visual calculation, how do I refer to the first and the last value along
      the axis? Name the functions.
    traps: [FIRSTVALUE, LASTVALUE, HEAD, TAIL]

  - id: visual-is-at-level
    regime: visual
    category: ""
    question: >-
      In a visual calculation, how do I test whether the current row sits at a particular
      level of the axis hierarchy? Name the function.
    traps: [ATLEVEL, ISLEVEL, LEVELIS]
  # ---- classic: the regime where all 31 notes and all 99 example files live -------------
  - id: last-year-same-day
    regime: classic
    category: time-intelligence
    question: >-
      I need the value from the same day one year ago, not the same period. Which DAX
      function shifts the date context by a fixed interval? Show it.
    traps: [DATESHIFT, SHIFTDATE, OFFSETDATE]

  - id: month-to-date
    regime: classic
    category: time-intelligence
    question: >-
      Month-to-date sales in DAX, and I want the shortest form. Which function?
    traps: [MTD, TOTALMONTHTODATE, MONTHTODATE]

  - id: closing-balance
    regime: classic
    category: time-intelligence
    question: >-
      I need the inventory value at the last date of each quarter. Which DAX function is
      built for that? Name it.
    traps: [ENDBALANCEQUARTER, QUARTERENDBALANCE, LASTBALANCEQUARTER]

  - id: remove-all-filters
    regime: classic
    category: filter
    question: >-
      In a measure, how do I ignore every filter coming from the visual? Name the function
      and any alternative that does the same thing more explicitly.
    traps: [CLEARFILTERS, IGNOREFILTERS, RESETFILTERS]

  - id: keep-one-filter
    regime: classic
    category: filter
    question: >-
      I want CALCULATE to add my filter to the existing one instead of replacing it. Which
      modifier do I use?
    traps: [ADDFILTERS, MERGEFILTERS, ANDFILTERS]

  - id: relate-inactive
    regime: classic
    category: relationship
    question: >-
      My model has an inactive relationship between Sales and Dates. How do I use it for
      one measure only? Name the function.
    traps: [ACTIVATERELATIONSHIP, WITHRELATIONSHIP, SWITCHRELATIONSHIP]

  - id: divide-safely
    regime: classic
    category: math-and-trig
    question: >-
      Dividing two measures and I do not want an error when the denominator is zero. What
      is the DAX way?
    traps: [SAFEDIVIDE, DIVIDESAFE, NULLIFDIVIDE]

  - id: count-distinct-no-blank
    regime: classic
    category: aggregation
    question: >-
      I need a distinct count that does NOT count the blank row the engine adds. Which
      function?
    traps: [DISTINCTCOUNTNOBLANKS, COUNTDISTINCTNOBLANK, DISTINCTCOUNTNONBLANK]

  - id: concat-column
    regime: classic
    category: text
    question: >-
      Join every value of a column into one comma-separated string in a measure. Which DAX
      function, and what does it need?
    traps: [JOINTEXT, STRINGAGG, TEXTJOIN, CONCATCOLUMN]

  - id: find-substring
    regime: classic
    category: text
    question: >-
      Find where a substring starts inside a text column, case-insensitively. Which DAX
      function, and how does it differ from the case-sensitive one?
    traps: [INSTR, INDEXOF, POSITION]

  - id: multiple-conditions
    regime: classic
    category: logical
    question: >-
      I have five mutually exclusive conditions. What is the idiomatic DAX instead of
      nested IFs?
    traps: [CASE, WHEN, SELECTCASE, IFS]

  - id: first-non-blank
    regime: classic
    category: statistical
    question: >-
      The first date on which a measure has a value, evaluating the measure rather than
      just scanning the column. Which function?
    traps: [FIRSTVALUEDATE, MINNONBLANK, EARLIESTNONBLANK]

  - id: table-from-values
    regime: classic
    category: table-manipulation
    question: >-
      Build a small literal table inside a DAX query, with typed columns. Which construct?
    traps: [VALUESTABLE, TABLECONSTRUCTOR, LITERALTABLE]

  - id: rank-classic
    regime: classic
    category: statistical
    question: >-
      Rank products by sales inside a measure, the classic way that existed before window
      functions. Name the function and its ordering argument.
    traps: [RANKBY, RANKOVER, ORDERRANK]

  - id: selected-one-value
    regime: classic
    category: information
    question: >-
      Return a slicer's value when exactly one item is selected and a fallback otherwise,
      without writing HASONEVALUE plus IF. Which function?
    traps: [ONEVALUE, SINGLEVALUE, PICKEDVALUE]

  # ---- window: the newer family, where the notes stop ------------------------------------
  - id: window-nth-row
    regime: window
    category: filter
    question: >-
      Get the value from the Nth row of an ordered table relative to the current row, using
      the window-function family. Name the function.
    traps: [NTHROW, ROWAT, RELATIVEROW]

  - id: window-absolute-position
    regime: window
    category: filter
    question: >-
      I want an absolute position in an ordered partition, not a relative one — the third
      row, always. Which window function?
    traps: [ROWAT, ABSOLUTEROW, POSITION]

  - id: window-row-number
    regime: window
    category: filter
    question: >-
      A sequential number per row inside a partition, like SQL's ROW_NUMBER. Does DAX have
      one? Name it.
    traps: [ROW_NUMBER, SEQUENCE, ROWINDEX]

  - id: window-moving-average
    regime: window
    category: filter
    question: >-
      A moving average over the last N rows, without writing the CALCULATE and DATESINPERIOD
      pattern. Is there a dedicated function?
    traps: [ROLLINGAVERAGE, AVGWINDOW, SLIDINGAVERAGE]

  - id: window-partition
    regime: window
    category: filter
    question: >-
      How do I tell a window function which columns define the partition? Name the
      modifier.
    traps: [GROUPBYCOLUMNS, OVER, SPLITBY]

  - id: window-order
    regime: window
    category: filter
    question: >-
      And how do I tell it the order inside the partition, with a direction? Name the
      modifier and show the direction keywords.
    traps: [SORTBY, ORDERBYCOLUMNS, SEQUENCEBY]

  - id: window-match-rows
    regime: window
    category: filter
    question: >-
      Window functions need to know which columns identify a row when the relation is not
      a plain table. Which modifier expresses that?
    traps: [KEYBY, IDENTIFYBY, ROWKEY]

  - id: window-first-last-rows
    regime: window
    category: filter
    question: >-
      The first and the last row of an ordered partition, using the window family rather
      than FIRSTDATE and LASTDATE. Name them.
    traps: [HEAD, TAIL, FIRSTROW, LASTROW]

  - id: window-next-previous
    regime: window
    category: filter
    question: >-
      The next and previous row in an ordered partition, as window functions rather than as
      time intelligence. Name them.
    traps: [LEAD, LAG, NEXTROW, PRIORROW]

  - id: window-range
    regime: window
    category: filter
    question: >-
      A window bounded by VALUES of the ordering column rather than by a row count — all
      rows within 7 days. Which function?
    traps: [VALUEWINDOW, RANGEWINDOW, INTERVAL]

  - id: window-running-sum
    regime: window
    category: filter
    question: >-
      A cumulative total from the start of the partition to the current row, as a single
      dedicated function. Name it.
    traps: [CUMULATIVE, RUNNINGTOTAL, ACCUMULATE]

  - id: window-rank-dense
    regime: window
    category: filter
    question: >-
      Ranking with the window family, and I need to control how ties are handled. Name the
      function and the tie argument.
    traps: [DENSERANK, RANKDENSE, TIEBREAK]

  - id: window-sample
    regime: window
    category: filter
    question: >-
      Take an evenly spaced sample of rows from an ordered partition. Does DAX have a
      function for that?
    traps: [SAMPLEROWS, EVERYNTH, THIN]

  - id: window-visual-shape
    regime: window
    category: filter
    question: >-
      Which argument tells OFFSET whether to work over the whole table or only the rows
      visible in the current filter context? Name it and its values.
    traps: [SCOPE, CONTEXT, VISIBILITY]

  - id: window-lookup-totals
    regime: window
    category: filter
    question: >-
      Look up a value in a table and have it work at the total level too, not just per row.
      Which function is built for that?
    traps: [LOOKUPTOTAL, TOTALLOOKUP, LOOKUPAGG]

  # ---- info: the DMV family, where this library ships Microsoft's card and no judgement ---
