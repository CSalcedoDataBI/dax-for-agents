name: Validate skills

on:
  # R1 decia "solo en PR" porque el push a main revalidaba lo que la PR ya habia
  # aprobado. Ese razonamiento suponia un flujo de PRs que aqui ya no existe: los
  # commits entran directos a main, asi que quitar el push no evitaba un run
  # duplicado, evitaba el UNICO run. Ninguna de las compuertas habia visto un solo
  # commit de main. Y R1 aqui no ahorra nada de todas formas: este repositorio es
  # publico, y los repos publicos no consumen cuota de Actions (R8).
  push:
    branches: [main]
  pull_request:
  # La PR de release la empuja release-please con el GITHUB_TOKEN, y sus runs se
  # quedan en `action_required` para siempre porque el actor es un bot y la politica
  # de aprobacion del repo es `first_time_contributors`. workflow_dispatch es el
  # unico disparador que GitHub exime de eso, y es release-please.yml quien lo
  # dispara contra la rama de release. Ver #9.
  workflow_dispatch:

permissions:
  contents: read
  # Para publicar el veredicto como commit status en la rama de release. Ver el
  # ultimo paso del job.
  statuses: write

# R2 — varios pushes seguidos a la misma PR: solo importa el ultimo veredicto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # R3 — contra el default de 360 min. Esto valida frontmatter y scripts:
    # si tarda mas de 10 min, algo se colgo.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Validate skills (frontmatter, INDEX, scripts)
        run: python scripts/validate_skills.py

      # Solo el arbol. El modo --history necesita el historial completo, y el checkout de
      # Actions viene con profundidad 1: pedirlo entero en cada PR es pagar el clon del
      # repositorio por un barrido que no cambia entre PRs. Ese se corre a mano, y hace
      # falta despues de cualquier reescritura de la historia -- ver CONTRIBUTING.md.
      - name: No credentials
        run: python scripts/check_no_credentials.py

      - name: Actions cost rules
        run: python scripts/check_workflow_cost.py

      - name: Plugin manifest matches the skills on disk
        run: python scripts/check_plugin_manifest.py

      - name: Prose counts match the tree
        run: python scripts/check_doc_claims.py

      # La seccion «Checking it yourself» del README enumera las garantias del repo y
      # llego a declarar cuatro compuertas mientras CI corria siete. No lo caza
      # check_doc_claims: ahi no hay un numero junto a un sustantivo, hay una lista.
      # Esta compara la lista con lo que este mismo fichero ejecuta. Ver #12.
      - name: The README lists every check CI runs
        run: python scripts/check_documented_gates.py

      # Estructura, no numeros: 3 ejemplos por funcion, modelo real, un result detras de
      # cada consulta. Que el numero sea el correcto lo comprueba lab/check_lab.py, y eso
      # necesita un motor tabular que CI no tiene.
      - name: Examples keep their contract
        run: python scripts/check_examples.py

      # La afirmacion mas grande del README ya no es una frase, es una tabla de numeros
      # que salen de corridas guardadas. Una tabla que nadie compara es la misma frase con
      # mas sitios donde pudrirse. La comparacion es gratis: las respuestas estan en el
      # repo y contar invenciones es un lookup contra catalog.json. Ver #20.
      - name: The README's invention table matches its runs
        run: python scripts/check_eval_claims.py

      # catalog.md es lo que el agente lee para saber que existe, y llego a ofrecerle
      # `DISTINCT column` y `T.INV.2t`: un nombre con espacio y una errata de mayusculas
      # del propio indice de Microsoft. La biblioteca contra la invencion dandole algo que
      # no compila. Lo caza el motor en una consulta, pero eso necesita datos; esto es la
      # parte comprobable desde el arbol. Ver #17.
      - name: Every catalogue name is a name you can type
        run: python scripts/check_function_names.py

      # 87 imagenes de las fichas apuntaban al raw de query-docs, que devuelve 404 desde
      # 2026-08. Learn sirve las mismas y se comprobaron las 87 una a una. Esto impide que
      # el host muerto vuelva. Offline a proposito: una compuerta que depende del uptime
      # de otro se acaba re-lanzando en vez de leyendose. Ver #13.
      - name: No card points an image at the dead upstream host
        run: python scripts/check_dead_media.py

      # La otra mitad del mismo contrato. check_examples.py dice que los ficheros de
      # ejemplo estan bien formados; esto dice que las fichas apuntan de verdad a ellos.
      # Es mas fuerte que las tres comparaciones que sustituye porque re-deriva TODO lo que
      # el sync calcula del arbol propio y falla ante cualquier diferencia, incluida la que
      # a nadie se le ocurrio afirmar. Ver #8.
      - name: Cards and catalogue agree with notes/ and examples/
        run: python skills/dax-reference/scripts/refresh_local_metadata.py --check

      # Las dos imagenes del README se generan del arbol. Si alguien anade una nota o un
      # ejemplo y no las regenera, el mapa dice una cobertura que ya no existe -- que es
      # justo la clase de numero pudriendose que este repositorio no admite en prosa.
      - name: README assets match the tree
        run: python scripts/render_readme_assets.py --check

      - name: Unit tests (sync pipeline)
        run: python -m unittest discover -s skills/dax-reference/scripts -t skills/dax-reference/scripts -v

      - name: Unit tests (repo scripts)
        run: python -m unittest discover -s scripts -t scripts -v

      - name: Unit tests (evals)
        run: python -m unittest discover -s evals -t evals -v

      # El veredicto ya existe -- este job acaba de emitirlo sobre el SHA exacto de la
      # PR de release -- pero la PR no lo ve: los check runs de un `workflow_dispatch`
      # no entran en su rollup, asi que la pagina sigue diciendo "no checks reported"
      # sobre un arbol que si se comprobo, y quien mergea no puede distinguir verde de
      # no mirado. Un commit status si entra en el rollup, y ademas es lo que el ruleset
      # de main compara: por nombre de contexto, que es este job. #9
      #
      # `always()` porque un rojo tiene que llegar a la PR igual que un verde; el filtro
      # por rama para no plantar un status a mano sobre cualquier otra corrida.
      - name: Report the verdict on the release branch
        if: always() && startsWith(github.ref_name, 'release-please--')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}"             -f state="${{ job.status == 'success' && 'success' || 'failure' }}"             -f context="validate"             -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"             -f description="las compuertas corrieron sobre esta rama"
