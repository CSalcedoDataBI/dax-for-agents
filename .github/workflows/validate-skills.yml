name: Validate skills

on:
  # R1 decia "solo en PR" porque el push a main revalidaba lo que la PR ya habia
  # aprobado. Ese razonamiento suponia un flujo de PRs que aqui ya no existe: los
  # commits entran directos a main, asi que quitar el push no evitaba un run
  # duplicado, evitaba el UNICO run. Ninguna de las compuertas habia visto un solo
  # commit de main. Y R1 aqui no ahorra nada de todas formas: este repositorio es
  # publico, y los repos publicos no consumen cuota de Actions (R8).
  push:
    branches: [main]
  pull_request:
  # La PR de release la empuja release-please con el GITHUB_TOKEN, y sus runs se
  # quedan en `action_required` para siempre porque el actor es un bot y la politica
  # de aprobacion del repo es `first_time_contributors`. workflow_dispatch es el
  # unico disparador que GitHub exime de eso, y es release-please.yml quien lo
  # dispara contra la rama de release. Ver #9.
  workflow_dispatch:

permissions:
  contents: read

# R2 — varios pushes seguidos a la misma PR: solo importa el ultimo veredicto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # R3 — contra el default de 360 min. Esto valida frontmatter y scripts:
    # si tarda mas de 10 min, algo se colgo.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Validate skills (frontmatter, INDEX, scripts)
        run: python scripts/validate_skills.py

      # Solo el arbol. El modo --history necesita el historial completo, y el checkout de
      # Actions viene con profundidad 1: pedirlo entero en cada PR es pagar el clon del
      # repositorio por un barrido que no cambia entre PRs. Ese se corre a mano, y hace
      # falta despues de cualquier reescritura de la historia -- ver CONTRIBUTING.md.
      - name: No credentials
        run: python scripts/check_no_credentials.py

      - name: Actions cost rules
        run: python scripts/check_workflow_cost.py

      - name: Plugin manifest matches the skills on disk
        run: python scripts/check_plugin_manifest.py

      - name: Prose counts match the tree
        run: python scripts/check_doc_claims.py

      # Estructura, no numeros: 3 ejemplos por funcion, modelo real, un result detras de
      # cada consulta. Que el numero sea el correcto lo comprueba lab/check_lab.py, y eso
      # necesita un motor tabular que CI no tiene.
      - name: Examples keep their contract
        run: python scripts/check_examples.py

      # Las dos imagenes del README se generan del arbol. Si alguien anade una nota o un
      # ejemplo y no las regenera, el mapa dice una cobertura que ya no existe -- que es
      # justo la clase de numero pudriendose que este repositorio no admite en prosa.
      - name: README assets match the tree
        run: python scripts/render_readme_assets.py --check

      - name: Unit tests (sync pipeline)
        run: python -m unittest discover -s skills/dax-reference/scripts -t skills/dax-reference/scripts -v

      - name: Unit tests (repo scripts)
        run: python -m unittest discover -s scripts -t scripts -v

      - name: Unit tests (evals)
        run: python -m unittest discover -s evals -t evals -v
