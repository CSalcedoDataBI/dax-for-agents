name: Claude Code

# Triggers Claude when "@claude" appears in an issue, an issue/PR comment, or a
# PR review. Claude can then commit, push and open a PR on its own.
#
# Requires the repo secret CLAUDE_CODE_OAUTH_TOKEN, generated once with
# `claude setup-token`. That is the house standard: it draws on the Max
# subscription, which resets monthly, instead of metered API billing. The
# secret does not exist yet — the guard step below says so out loud rather
# than letting the action fail three retries deep with an auth error.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # R3 — against GitHub's 360-minute default. This is the one job here that
    # runs an agent, so it is the one that can hang: 360 minutes is 12% of the
    # monthly quota spent on a single stuck run. A real @claude turn takes 2-5.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Before checkout, so a missing credential costs seconds and names itself.
      - name: Require the review credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::The CLAUDE_CODE_OAUTH_TOKEN secret is missing. Generate it with 'claude setup-token' and store it with 'gh secret set CLAUDE_CODE_OAUTH_TOKEN'. Until then @claude cannot answer in this repository."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
