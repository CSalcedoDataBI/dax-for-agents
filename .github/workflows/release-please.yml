name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Para `gh workflow run` sobre la rama de release. Ver el ultimo paso.
  actions: write

# R2 con la excepcion del estandar: cancel-in-progress FALSE. Un release cancelado
# a medias deja tags y PRs inconsistentes, que cuesta mas que el minuto que ahorra.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # R3 — la accion lee commits y actualiza una PR: 15-30 s en los runs reales.
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # config + manifest are read from the repo root by default:
          #   release-please-config.json  /  .release-please-manifest.json

      # La PR de release se podia mergear sin que ninguna compuerta hubiese visto ese
      # arbol (#9). No es que los workflows no arranquen: arrancan y se quedan en
      # `action_required`, esperando una aprobacion manual, porque quien empuja la rama
      # es un bot. `workflow_dispatch` es el unico disparador que GitHub exime de esa
      # regla, asi que el veredicto se pide aqui, por nombre, y los dos jobs que salen
      # -- `validate` y `static` -- son exactamente los dos checks que el ruleset de
      # main exige.
      #
      # `pr` solo viene lleno cuando esta corrida creo o actualizo la PR; si no cambio
      # nada, no hay arbol nuevo que juzgar.
      - name: Ask the gates for a verdict on the release branch
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          echo "Dispatching gates against $BRANCH"
          gh workflow run validate-skills.yml --ref "$BRANCH"
          gh workflow run evals.yml --ref "$BRANCH"
